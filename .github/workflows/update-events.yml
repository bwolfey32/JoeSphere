name: Update events.json

on:
  schedule:
    # Twice a week — the UFC schedule doesn't move faster than this, and a
    # lighter cadence keeps the commit history readable.
    - cron: '17 6 * * 1,4'
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v5 of these actions runs on the Node 24 runtime. v4 ran on Node 20,
      # which GitHub now warns is deprecated — that warning is about the
      # actions' own runtime, not the version used for our script below.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # If every source fails the script exits non-zero and writes nothing, so
      # the job fails here and the committed events.json survives untouched —
      # a broken upstream must never blank the site.
      - name: Fetch scheduled events
        run: node scripts/fetch-events.mjs
        env:
          # Optional. Without it the run still succeeds — it just uses the
          # 15-episode RSS window and reports no channel-level figures.
          # Add under Settings → Secrets and variables → Actions.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # view-history.json must be committed too. It is the accumulating record —
      # one dated view sample per episode per run — so leaving it out meant it
      # was rewritten every run and then thrown away, and the growth figures it
      # exists to produce could never appear.
      - name: Commit if changed
        run: |
          if git diff --quiet -- events.json view-history.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json view-history.json
          git commit -m "Update events.json from scheduled sources"
          git push
